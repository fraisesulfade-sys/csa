name: TikTok conectar
on:
  push:
    paths: ["dados/tiktok_codigo.txt"]
permissions:
  contents: write
jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tiktok.py trocar "$(cat dados/tiktok_codigo.txt)"
        env:
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY || 'sbawm8gatzvhiyj9mr' }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      - if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git rm -q --cached dados/tiktok_codigo.txt; rm -f dados/tiktok_codigo.txt
          git add -A dados && git commit -m "TikTok conectado" && git push || true
