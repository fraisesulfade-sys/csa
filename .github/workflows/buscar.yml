name: Buscar no feed
on:
  push:
    paths: ["dados/busca.txt", "scripts/buscar_feed.py"]
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python3 scripts/buscar_feed.py
        env:
          SHOPEE_FEED_URL: ${{ secrets.SHOPEE_FEED_URL }}
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add dados/busca.json dados/busca.jpg && git commit -m "Resultado da busca" && git push || true
