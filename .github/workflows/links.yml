name: Links do post
on:
  push:
    paths: ["dados/pedido-links.txt"]
permissions:
  contents: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/links_post.py $(head -1 dados/pedido-links.txt | cut -d' ' -f1)
        env:
          SHOPEE_FEED_URL: ${{ secrets.SHOPEE_FEED_URL }}
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add dados && git commit -m "Links de afiliada" && git push || true
